[package]
name = "wiscripts_windows"
version = "0.3.0"
description = "WiScripts Windows Desktop Application"
authors = ["WiScripts Team"]
edition = "2021"

[lib]
name = "wiscripts_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2.0.0"
tauri-plugin-updater = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sysinfo = "0.30"
log = "0.4"
simplelog = "0.12"


